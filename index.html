<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="茄記">
<meta name="theme-color" content="#F7F1E8">
<link rel="apple-touch-icon" href="icon.png">
<title>茄記</title>
<style>
:root{
  --app:#F7F1E8; --bar:#F0E6D8; --line:#E0D3C1; --text:#2A2230; --muted:#7A6E7F;
  --egg:#5B3A72; --stem:#6E8B3D; --card:#FFFDF9;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--app);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;font-size:17px}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;outline:0}
.hidden{display:none!important}
svg{display:block}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.ib:active{background:rgba(0,0,0,.08)}
.ib svg{width:26px;height:26px}

/* ================= LIST ================= */
#listView{min-height:100%;display:flex;flex-direction:column}
.lhead{position:sticky;top:0;z-index:5;background:var(--bar);border-bottom:1px solid var(--line)}
.lbar{display:flex;align-items:center;gap:4px;padding:calc(var(--safe-t) + 6px) 6px 6px 16px;min-height:56px}
.lbar h1{flex:1;margin:0;font-size:26px;font-weight:600;color:var(--egg);letter-spacing:1px}
.lbar input{flex:1;min-width:0;font-size:18px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.colorgrid{width:26px;height:26px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.colorgrid i{display:block}
.sortbar{display:block;width:calc(100% - 16px);margin:0 8px 8px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:9px;color:var(--muted);text-align:center;font-size:18px}
.filtertag{font-size:14px;color:var(--muted);text-align:center;margin:-2px 0 8px}
#list{flex:1;padding:6px 8px calc(var(--safe-b) + 150px)}
.row{display:flex;align-items:center;width:100%;min-height:68px;margin-bottom:8px;text-align:left;border-radius:12px;
  border-left:6px solid;padding:10px 12px 10px 14px;gap:10px;box-shadow:0 1px 2px rgba(60,40,30,.10)}
.row:active{filter:brightness(.95)}
.row .rt{flex:1;font-size:21px;line-height:1.3;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .rd{flex:none;display:flex;align-items:center;gap:6px;font-size:16px;color:#555;text-align:right}
.row .rd svg{width:20px;height:20px;flex:none}
.row .prog{font-size:13px;color:#777}
.empty{text-align:center;color:var(--muted);padding:56px 20px;line-height:1.8}
.empty img{display:block;width:min(230px,62%);height:auto;margin:0 auto 8px}
.fab{position:fixed;right:14px;bottom:calc(var(--safe-b) + 72px);width:66px;height:86px;
  display:grid;place-items:center;z-index:6;filter:drop-shadow(0 5px 8px rgba(60,30,80,.28));transition:transform .12s}
.fab img{width:58px;height:auto;display:block}
.fab .plus{position:absolute;right:0;bottom:8px;width:28px;height:28px;border-radius:50%;background:var(--stem);color:#fff;
  display:grid;place-items:center;border:2.5px solid #fff}
.fab .plus svg{width:16px;height:16px}
.fab:active{transform:scale(.92)}

/* ---- bloom / harvest pop ---- */
.pop{position:fixed;z-index:40;pointer-events:none;height:auto;animation:popup 1.15s cubic-bezier(.2,.8,.3,1) forwards}
.pop.f{width:34px}
.pop.e{width:40px}
@keyframes popup{
  0%{transform:translateY(8px) scale(.2);opacity:0}
  22%{transform:translateY(-4px) scale(1.18);opacity:1}
  36%{transform:translateY(0) scale(1)}
  75%{transform:translateY(-22px) scale(1);opacity:1}
  100%{transform:translateY(-38px) scale(.9);opacity:0}}

/* ---- garden ---- */
.garden{position:fixed;inset:0;z-index:30;background:var(--app);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-t) + 4px) 0 calc(var(--safe-b) + 24px)}
.ghead{display:flex;align-items:center;gap:4px;padding:6px 6px 0}
.ghead h2{flex:1;margin:0;font-size:24px;font-weight:600;color:var(--egg)}
.field{position:relative;width:100%;aspect-ratio:941/800;background:url(img/field.webp) center/100% 100% no-repeat}
.field img{position:absolute;width:8%;height:auto;transform:translate(-50%,-90%);filter:drop-shadow(0 2px 2px rgba(60,30,20,.25))}
.field .sign{position:absolute;left:79.5%;top:9.6%;transform:translate(-50%,-50%) rotate(4deg);font-size:13px;font-weight:700;
  color:#6B4423;white-space:nowrap;text-align:center;line-height:1.15}
.gstats{display:flex;gap:10px;padding:4px 16px 0}
.gstat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;display:flex;align-items:center;gap:10px}
.gstat img{width:34px;height:auto;flex:none}
.gstat b{display:block;font-size:24px;color:var(--egg);line-height:1.1}
.gstat span{font-size:13px;color:var(--muted)}
.gnote{margin:14px 22px 0;font-size:14px;line-height:1.8;color:var(--muted);text-align:center}
.gtotal{margin:10px 22px 0;font-size:13px;color:var(--muted);text-align:center}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);border-top:1px solid var(--line);
  display:flex;padding-bottom:var(--safe-b)}
.bnav button{flex:1;height:60px;display:grid;place-items:center;color:#9A8F9E}
.bnav button.on{color:var(--egg)}
.bnav svg{width:28px;height:28px}

/* ================= NOTE ================= */
#noteView{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:var(--bg)}
.nhead{background:var(--hd);display:flex;align-items:center;gap:4px;
  padding:calc(var(--safe-t) + 6px) 4px 6px 4px;min-height:58px;flex:none}
#nTitle{flex:1;min-width:0;font-size:23px;font-weight:500;background:transparent;border:0;padding:8px 6px;border-radius:6px}
#nTitle:focus{background:rgba(255,255,255,.55)}
#nTitle::placeholder{color:currentColor;opacity:.45}
.swatch{width:30px;height:30px;border-radius:7px;border:2px solid rgba(255,255,255,.8);background:var(--hd);
  filter:saturate(1.5) brightness(.9);flex:none;margin:0 6px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.nmeta{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;font-size:15px;color:rgba(0,0,0,.5);flex:none}
.nbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.lined{background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 43px, var(--rule) 43px, var(--rule) 44px);
  background-attachment:local;line-height:44px;font-size:20px;padding:0 14px;min-height:100%}
#eText{display:block;width:100%;border:0;resize:none;background-color:transparent;min-height:100%;padding:0 0 160px}

/* --- idea list --- */
.cl{padding:2px 0 200px}
.ci{position:relative;border-bottom:1px solid var(--rule);overflow:hidden;touch-action:pan-y}
.ci .under{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:15px;font-weight:600}
.ci .under .l{color:#fff}
.ci .under .r{color:#fff}
.ci.sw-r .under{background:#7a7a7a}
.ci.sw-l .under{background:#d0443a}
.ci.sw-r .under .r, .ci.sw-l .under .l{visibility:hidden}
.ci .cin{position:relative;display:flex;align-items:flex-start;gap:2px;padding:0 0 0 14px;background:var(--bg);will-change:transform}
.ci.focus .cin{background:color-mix(in srgb, var(--bg) 55%, #fff)}
.ci textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;font-size:20px;line-height:1.5;
  padding:12px 4px;height:54px;overflow:hidden;display:block}
.ci.done textarea{text-decoration:line-through;text-decoration-thickness:2px;color:rgba(0,0,0,.38)}
.ci .x{flex:none;width:40px;height:52px;display:none;place-items:center;color:rgba(0,0,0,.4);font-size:19px}
.ci.focus .x{display:grid}
.ci .grip{flex:none;width:36px;height:52px;display:grid;place-items:center;color:rgba(0,0,0,.22);touch-action:none;font-size:18px;letter-spacing:-2px}
.ci.focus .grip{display:none}
.ci.dragging{z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.addrow{display:flex;align-items:center;gap:6px;width:100%;padding:0 0 0 14px;height:54px;font-size:19px;color:rgba(0,0,0,.45);text-align:left;border-bottom:1px solid var(--rule)}
.addrow span:first-child{font-size:22px}
.hint{font-size:13px;color:rgba(0,0,0,.4);text-align:center;padding:14px}

/* keyboard toolbar */
.kbar{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;align-items:center;gap:6px;
  padding:6px 10px calc(var(--safe-b) + 6px);background:var(--hd);border-top:1px solid rgba(0,0,0,.1);will-change:transform}
.kbar button{height:40px;min-width:46px;display:grid;place-items:center;color:rgba(0,0,0,.65);border-radius:10px}
.kbar button:disabled{opacity:.3}
.kbar svg{width:26px;height:26px}
.kbar .sp{flex:1}
.kbar .done{background:rgba(0,0,0,.75);color:#fff;font-size:16px;padding:0 16px}

/* ================= DIALOG / SHEET ================= */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.backdrop.bottom{align-items:flex-end;padding:0}
.dlg{background:var(--card);border-radius:26px;width:100%;max-width:420px;padding:26px 24px 14px}
.dlg h3{margin:0 0 18px;font-size:21px;line-height:1.5;font-weight:500}
.dlg .acts{display:flex;justify-content:flex-end;gap:30px;margin-top:16px}
.dlg .acts button{color:var(--egg);font-size:19px;padding:10px 6px}
.sheet{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:8px 0 calc(var(--safe-b) + 8px);max-height:80vh;overflow:auto}
.sheet h4{margin:8px 20px 6px;font-size:15px;color:var(--muted);font-weight:500}
.sheet .opt{display:flex;align-items:center;gap:14px;width:100%;padding:15px 20px;text-align:left;font-size:18px}
.sheet .opt:active{background:#F3ECE2}
.sheet .opt.danger{color:#d0443a}
.sheet .opt .dot{width:24px;height:24px;border-radius:5px;border:1px solid rgba(0,0,0,.2);flex:none}
.sheet .opt .on{margin-left:auto;color:var(--egg);font-weight:700}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:10px 20px 18px}
.palette button{aspect-ratio:1;border-radius:10px;border:1px solid rgba(0,0,0,.2)}
.palette button.on{outline:3px solid var(--egg);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 150px);transform:translateX(-50%);z-index:50;
  background:#3A2E42;color:#fff;padding:11px 18px;border-radius:22px;font-size:15px;display:flex;gap:16px;align-items:center;white-space:nowrap}
.toast button{color:#CDB4E6;font-weight:700}
</style>
</head>
<body>

<!-- ============ LIST ============ -->
<div id="listView">
  <div class="lhead">
    <div class="lbar">
      <h1 id="lTitle">茄記</h1>
      <input id="q" type="search" class="hidden" placeholder="搜尋筆記" autocomplete="off">
      <button class="ib" id="filterBtn" aria-label="依顏色篩選"><span class="colorgrid" id="cgrid"></span></button>
      <button class="ib" id="lMore" aria-label="選單"></button>
    </div>
    <button class="sortbar" id="sortBtn"></button>
    <div class="filtertag hidden" id="filterTag"></div>
  </div>
  <main id="list"></main>
  <button class="fab" id="fab" aria-label="新增筆記"></button>
  <nav class="bnav">
    <button id="navNotes" class="on" aria-label="筆記"></button>
    <button id="navSearch" aria-label="搜尋"></button>
    <button id="navTrash" aria-label="垃圾桶"></button>
    <button id="navMenu" aria-label="選單"></button>
  </nav>
</div>

<!-- ============ NOTE ============ -->
<div id="noteView" class="hidden">
  <div class="nhead">
    <button class="ib" id="hBack" aria-label="返回"></button>
    <input id="nTitle" placeholder="標題" autocomplete="off" enterkeyhint="next">
    <button class="swatch" id="hColor" aria-label="顏色"></button>
    <button class="ib" id="hMore" aria-label="更多"></button>
  </div>
  <div class="nmeta"><span id="mLeft"></span><span id="mRight"></span></div>
  <div class="nbody" id="nbody"></div>
  <div class="kbar hidden" id="kbar">
    <button id="undoBtn" aria-label="復原"></button>
    <button id="redoBtn" aria-label="重做"></button>
    <div class="sp"></div>
    <button class="done" id="kDone">完成</button>
  </div>
</div>

<div id="overlay"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
(() => {
/* ---------------- icons ---------------- */
const I = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L20 7"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  notes:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a2 2 0 0 1 2 2v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm2 5v2h8V8H8zm0 4v2h8v-2H8zm0 4v2h5v-2H8zM7 1h2v4H7zm4 0h2v4h-2zm4 0h2v4h-2z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v1"/></svg>',
  redo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0-6 6v1"/></svg>',
};

/* ---------------- art ---------------- */
const IMG = n => `img/${n}.webp`;
const emptyArt = n => `<img src="${IMG(n)}" alt="">`;

/* ---------------- colors ---------------- */
const COLORS = {
  purple:{bg:'#EDE4F3', hd:'#8E6AAE', rule:'#D6C6E6', name:'茄子'},
  yellow:{bg:'#FBF2C9', hd:'#EECF5E', rule:'#EEDF9A', name:'玉米'},
  orange:{bg:'#FCE2CB', hd:'#F09C5E', rule:'#F2C49E', name:'紅蘿蔔'},
  red:   {bg:'#F9D7D2', hd:'#E07A6F', rule:'#EDADA5', name:'甜椒'},
  blue:  {bg:'#DCE5F4', hd:'#7F99D0', rule:'#B7C7E7', name:'藍莓'},
  green: {bg:'#E0ECD2', hd:'#8DAF62', rule:'#C3D8A9', name:'青蔥'},
  gray:  {bg:'#EEE7DE', hd:'#B6A895', rule:'#DACFC1', name:'香菇'},
  black: {bg:'#DAD5DB', hd:'#4A3F4E', rule:'#C4BDC6', name:'黑豆'},
  white: {bg:'#FFFDF9', hd:'#E8E0D3', rule:'#EFE8DC', name:'白蘿蔔'},
};
const CKEYS = Object.keys(COLORS);
const col = c => COLORS[c] || COLORS.yellow;
const SORTS = {updated:'依修改的時間排序', created:'依建立的時間排序', title:'依標題排序', color:'依顏色排序'};

/* ---------------- storage ---------------- */
const KEY = 'colornotes.v1';
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2 = x => String(x).padStart(2,'0');

function fixNote(n){
  if (!COLORS[n.color]) n.color = n.color==='pink' ? 'red' : 'yellow';
  n.items = (n.items||[]).map(i => ({ id: i.id || uid(), t: i.t || '', done: !!i.done, b: i.b === undefined ? true : !!i.b }));
  n.title = n.title || ''; n.body = n.body || '';
  n.b = n.b === undefined ? true : !!n.b;
  return n;
}
/* garden: days['YYYY-MM-DD'] = {f: flowers, e: eggplants, g: golden}; tot = all-time */
function fixGarden(s){
  if (s.garden && s.garden.days && s.garden.tot) return;
  // first run: count what already exists so past ideas aren't lost
  const live = s.notes.filter(n=>!n.deleted);
  const items = live.flatMap(n=>n.items);
  s.garden = { days:{}, tot:{ f: items.filter(i=>i.t.trim()).length + live.filter(n=>n.type==='text'&&n.body.trim()).length,
                               e: items.filter(i=>i.done).length } };
}
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.notes)){ s.notes.forEach(fixNote); fixGarden(s); return s; }
  } catch(e){}
  return { notes: [], sort:'updated', garden:{ days:{}, tot:{f:0,e:0} } };
}
let state = load();
let ui = { view:'notes', filter:'all', q:'', searching:false, sort: state.sort || 'updated' };
let cur = null, hist = [], hpos = -1, histTimer = null;

function save(){
  state.sort = ui.sort;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ toast('儲存失敗：空間不足'); }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}

function listDate(ts){
  const d = new Date(ts), n = new Date();
  if (d.toDateString() === n.toDateString()) return `${p2(d.getHours())}:${p2(d.getMinutes())}`;
  if (d.getFullYear() === n.getFullYear()) return `${d.getMonth()+1}月${d.getDate()}日`;
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}
function fullDate(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}/${p2(d.getMonth()+1)}/${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}
function ago(ts){
  const s = (Date.now()-ts)/1000;
  if (s < 60) return '剛剛';
  if (s < 3600) return `${Math.floor(s/60)} 分鐘前`;
  if (s < 86400) return `${Math.floor(s/3600)} 小時前`;
  if (s < 86400*30) return `${Math.floor(s/86400)} 天前`;
  if (s < 86400*365) return `${Math.floor(s/86400/30)} 個月前`;
  return `${Math.floor(s/86400/365)} 年前`;
}
const plain = n => n.type==='text' ? n.body : n.items.map(i=>i.done ? i.t.split('').map(c=>c+'\u0336').join('') : i.t).join('\n');
const label = n => n.title.trim() || (n.type==='text' ? n.body : n.items.map(i=>i.t).join('\n')).split('\n').find(l=>l.trim()) || '（無標題）';
const isEmpty = n => !n.title.trim() && (n.type==='text' ? !n.body.trim() : n.items.every(i=>!i.t.trim()));

/* ---------------- static icons ---------------- */
$('#lMore').innerHTML = I.dots; $('#fab').innerHTML = `<img src="${IMG('face-happy')}" alt=""><span class="plus">${I.plus}</span>`;
$('#navNotes').innerHTML = I.notes; $('#navSearch').innerHTML = I.search;
$('#navTrash').innerHTML = I.trash; $('#navMenu').innerHTML = I.menu;
$('#hBack').innerHTML = I.back; $('#hMore').innerHTML = I.dots;
$('#undoBtn').innerHTML = I.undo; $('#redoBtn').innerHTML = I.redo;

/* ================= LIST ================= */
function renderList(){
  const trash = ui.view === 'trash';
  $('#lTitle').textContent = trash ? '垃圾桶' : '茄記';
  $('#lTitle').classList.toggle('hidden', ui.searching);
  $('#q').classList.toggle('hidden', !ui.searching);
  $('#fab').classList.toggle('hidden', trash);
  $('#sortBtn').textContent = SORTS[ui.sort] + ' ▾';
  $('#navNotes').classList.toggle('on', !trash && !ui.searching);
  $('#navSearch').classList.toggle('on', ui.searching);
  $('#navTrash').classList.toggle('on', trash);
  $('#cgrid').innerHTML = ui.filter === 'all'
    ? ['#8E6AAE','#EECF5E','#8DAF62','#F09C5E'].map(c=>`<i style="background:${c}"></i>`).join('')
    : `<i style="background:${col(ui.filter).hd};grid-column:1/3;grid-row:1/3;border-radius:3px"></i>`;
  const ft = $('#filterTag');
  ft.classList.toggle('hidden', ui.filter==='all');
  ft.textContent = ui.filter==='all' ? '' : `只顯示${col(ui.filter).name}　·　點右上色塊切換`;

  const q = ui.q.trim().toLowerCase();
  let notes = state.notes.filter(n => trash ? n.deleted : !n.deleted)
    .filter(n => ui.filter==='all' || n.color===ui.filter)
    .filter(n => !q || (n.title+'\n'+n.body+'\n'+n.items.map(i=>i.t).join('\n')).toLowerCase().includes(q));
  notes.sort((a,b) => {
    if (!trash && a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    switch(ui.sort){
      case 'created': return b.created - a.created;
      case 'title': return label(a).localeCompare(label(b), 'zh-Hant');
      case 'color': return CKEYS.indexOf(a.color)-CKEYS.indexOf(b.color) || b.updated-a.updated;
      default: return b.updated - a.updated;
    }
  });
  const el = $('#list');
  if (!notes.length){
    el.innerHTML = trash
      ? `<div class="empty">${emptyArt('sleep')}垃圾桶是空的<br>茄子在睡覺</div>`
      : (q||ui.filter!=='all')
        ? `<div class="empty">${emptyArt('search')}找不到符合的筆記</div>`
        : `<div class="empty">${emptyArt('basket')}菜籃還是空的<br>點右下角的茄子，寫下第一個想法</div>`;
    return;
  }
  el.innerHTML = notes.map(n => {
    const c = col(n.color);
    return `<button class="row" data-id="${n.id}" style="background:${c.bg};border-left-color:${c.hd}">
      <span class="rt">${esc(label(n))}</span>
      <span class="rd">${n.pinned?'📌':''}${n.type==='check'?I.check:''}<span>${listDate(n.updated)}</span></span>
    </button>`;
  }).join('');
}

/* ================= NOTE ================= */
function newNote(type){
  const n = { id:uid(), type, title:'', body:'', items: [],
    color: ui.filter!=='all' ? ui.filter : 'purple', pinned:false, deleted:false,
    created:Date.now(), updated:Date.now(), b:false };
  state.notes.push(n);
  openNote(n);
  setTimeout(() => {
    if (type==='text') $('#eText').focus();
    else focusNew();
  }, 80);
}
function openNote(n){
  cur = n;
  hist = []; hpos = -1; snapshot(true);
  $('#noteView').classList.remove('hidden');
  $('#nTitle').value = n.title;
  setTheme(); paintMeta(); paintBody();
}
function setTheme(){
  const c = col(cur.color), v = $('#noteView').style;
  v.setProperty('--bg', c.bg); v.setProperty('--hd', c.hd); v.setProperty('--rule', c.rule);
  document.querySelector('meta[name=theme-color]').content = c.hd;
  $('.nhead').style.color = cur.color==='black' ? '#fff' : '#1f1f1f';
}
function paintMeta(){
  $('#mLeft').textContent = ago(cur.updated);
  $('#mRight').textContent = fullDate(cur.updated);
}
function paintBody(){
  const b = $('#nbody');
  if (cur.type === 'text'){
    b.innerHTML = `<div class="lined"><textarea id="eText" placeholder="開始輸入…"></textarea></div>`;
    const t = $('#eText'); t.value = cur.body;
    t.addEventListener('input', () => { cur.body = t.value; sizeText(); changed(); });
    sizeText();
    return;
  }
  b.innerHTML = `<button class="addrow" id="addItem"><span>＋</span><span>新增一行</span></button><div class="cl" id="cl"></div>`;
  renderChecklist();
}
const splitLines = txt => txt.split(/\r?\n/).map(s=>s.replace(/^\s*([-*•□☐✓☑]|\d+[.)、])\s*/,'').trim()).filter(Boolean);
function addTop(lines){
  if (!lines.length) return;
  cur.items = cur.items.filter(i => i.t.trim());
  cur.items.unshift(...lines.map(t => ({id:uid(), t, done:false, b:false})));
  changed(true); renderChecklist();
  $('#nbody').scrollTop = 0;
}
function focusNew(){
  const first = cur.items[0];
  if (first && !first.t.trim()){ focusItem(first.id); return; }
  const n = {id:uid(), t:'', done:false, b:false};
  cur.items.unshift(n); changed(); renderChecklist();
  $('#nbody').scrollTop = 0; focusItem(n.id, 0);
}
function sizeText(){
  const t = $('#eText'); if (!t) return;
  t.style.height = 'auto';
  t.style.height = Math.max(t.scrollHeight, $('#nbody').clientHeight) + 'px';
}

/* ---------- idea list ---------- */
function itemHTML(it){
  return `<div class="ci ${it.done?'done':''}" data-id="${it.id}">
    <div class="under"><span class="l">${it.done?'恢復':'劃掉'}</span><span class="r">刪除</span></div>
    <div class="cin">
      <textarea rows="1" enterkeyhint="next">${esc(it.t)}</textarea>
      <button class="x" aria-label="刪除這行">✕</button>
      <span class="grip" aria-label="拖曳排序">⋮⋮</span>
    </div>
  </div>`;
}
function renderChecklist(){
  let h = cur.items.map(itemHTML).join('');
  let seen = false; try { seen = localStorage.getItem('cn.hint') === '1'; } catch(e){}
  if (!seen && cur.items.some(i=>i.t.trim())) h += `<div class="hint">向右滑＝劃掉，結一顆茄子　·　向左滑＝刪除</div>`;
  $('#cl').innerHTML = h;
  $('#cl').querySelectorAll('.ci textarea').forEach(t => sizeTA(t));
}
function sizeTA(t, min=54){ t.style.height = '0px'; t.style.height = Math.max(min, t.scrollHeight) + 'px'; }
const findItem = id => cur.items.findIndex(i=>i.id===id);
function focusItem(id, caret){
  const t = $(`#nbody .ci[data-id="${id}"] textarea`); if (!t) return;
  t.focus();
  const p = caret == null ? t.value.length : caret;
  try { t.setSelectionRange(p,p); } catch(e){}
  t.closest('.ci').scrollIntoView({block:'nearest'});
}
function insertAfter(id, text='', focus=true){
  const n = {id:uid(), t:text, done:false, b:false};
  const idx = id == null ? cur.items.length - 1 : findItem(id);
  cur.items.splice(idx+1, 0, n);
  changed(); renderChecklist();
  if (focus) focusItem(n.id, 0);
  bloomCheck(true, n.id);
  return n;
}
const dayKey = (d=new Date()) => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
function gday(k=dayKey()){ return state.garden.days[k] || (state.garden.days[k] = {f:0,e:0,g:0}); }
function pop(id, kind){
  const row = $(`#nbody .ci[data-id="${id}"]`); if (!row) return;
  const r = row.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
  const im = document.createElement('img');
  im.src = IMG(kind==='f' ? 'flower' : kind==='g' ? 'egg-gold' : 'egg-small');
  im.className = 'pop ' + (kind==='f' ? 'f' : 'e');
  im.style.left = (r.right - (kind==='f' ? 50 : 58)) + 'px';
  im.style.top = (r.top + r.height/2 - (kind==='f' ? 20 : 30)) + 'px';
  document.body.appendChild(im);
  setTimeout(() => im.remove(), 1200);
}
// an idea "blooms" the first time it is left with text in it
function bloomCheck(anim, skipId){
  if (!cur) return;
  let n = 0;
  if (cur.type === 'text'){
    if (!cur.b && cur.body.trim()){ cur.b = true; n++; }
  } else cur.items.forEach(it => {
    if (!it.b && it.t.trim() && it.id !== skipId){ it.b = true; n++; if (anim) pop(it.id, 'f'); }
  });
  if (n){ gday().f += n; state.garden.tot.f += n; save(); }
}
function harvest(on){
  const d = gday(), t = state.garden.tot;
  if (on){ t.e++; d.e++; if (t.e % 10 === 0){ d.g++; return 'g'; } return 'e'; }
  // un-striking only takes back an eggplant picked today, never an old one
  if (d.e > 0){ if (t.e % 10 === 0 && d.g > 0) d.g--; d.e--; t.e--; }
  return null;
}
function toggleStrike(id){
  const it = cur.items[findItem(id)]; if (!it || !it.t.trim()) return;
  it.done = !it.done;
  const kind = harvest(it.done);
  if (!it.b){ it.b = true; gday().f++; state.garden.tot.f++; }
  changed(true); renderChecklist();
  if (kind) pop(id, kind);
  try { localStorage.setItem('cn.hint','1'); } catch(e){}
}
function removeItem(id){
  const idx = findItem(id); if (idx < 0) return;
  const removed = cur.items.splice(idx,1)[0];
  changed(true); renderChecklist();
  try { localStorage.setItem('cn.hint','1'); } catch(e){}
  if (removed.t.trim()) toast('已刪除', {label:'復原', fn:()=>{ if(cur){ cur.items.splice(idx,0,removed); changed(true); renderChecklist(); } }});
}

$('#nbody').addEventListener('click', e => {
  if (!cur || cur.type!=='check') return;
  if (e.target.closest('#addItem')) return focusNew();
  const row = e.target.closest('.ci');
  if (row && e.target.closest('.x')){
    const id = row.dataset.id, idx = findItem(id);
    removeItem(id);
    const next = cur.items[Math.min(idx, cur.items.length-1)]; if (next) focusItem(next.id); else focusNew();
    return;
  }
  // tap empty space = jump to the new-idea field
  if (e.target.id === 'cl' || e.target.id === 'nbody' || e.target.classList.contains('hint')) focusNew();
});
$('#nbody').addEventListener('input', e => {
  const row = e.target.closest('.ci'); if (!row || !cur) return;
  cur.items[findItem(row.dataset.id)].t = e.target.value;
  sizeTA(e.target); changed();
});
$('#nbody').addEventListener('keydown', e => {
  const row = e.target.closest('.ci'); if (!row || e.target.tagName!=='TEXTAREA') return;
  if (e.isComposing || e.keyCode === 229) return;
  const id = row.dataset.id, idx = findItem(id), it = cur.items[idx], ta = e.target;
  if (e.key === 'Enter'){
    e.preventDefault();
    if (!ta.value.trim()){ ta.blur(); return; }          // Enter on empty line = stop
    const pos = ta.selectionStart, after = ta.value.slice(pos);
    it.t = ta.value.slice(0,pos);
    insertAfter(id, after);
  } else if (e.key === 'Backspace' && ta.selectionStart === 0 && ta.selectionEnd === 0 && idx > 0){
    e.preventDefault();
    const prev = cur.items[idx-1], caret = prev.t.length;
    prev.t += it.t; cur.items.splice(idx,1);
    changed(true); renderChecklist(); focusItem(prev.id, caret);
  }
});
// paste multiple lines → multiple lines
$('#nbody').addEventListener('paste', e => {
  const row = e.target.closest('.ci'); if (!row) return;
  const txt = (e.clipboardData || window.clipboardData)?.getData('text') || '';
  if (!txt.includes('\n')) return;
  e.preventDefault();
  const lines = splitLines(txt);
  if (!lines.length) return;
  const ta = e.target, id = row.dataset.id, it = cur.items[findItem(id)];
  const before = ta.value.slice(0, ta.selectionStart), after = ta.value.slice(ta.selectionEnd);
  it.t = before + lines[0];
  let prevId = id;
  for (let k=1;k<lines.length;k++){
    const n = {id:uid(), t:lines[k], done:false, b:false};
    cur.items.splice(findItem(prevId)+1, 0, n); prevId = n.id;
  }
  const last = cur.items[findItem(prevId)], caret = last.t.length; last.t += after;
  changed(true); renderChecklist(); focusItem(prevId, caret);
});
// focus highlight + keyboard bar
document.addEventListener('focusin', e => {
  document.querySelectorAll('.ci.focus').forEach(r=>r.classList.remove('focus'));
  const r = e.target.closest && e.target.closest('.ci'); if (r) r.classList.add('focus');
  if (cur && cur.type==='check') bloomCheck(true, r ? r.dataset.id : null);
  if (cur && (e.target.tagName==='TEXTAREA' || e.target.id==='nTitle')) showKbar(true);
});
document.addEventListener('focusout', () => {
  setTimeout(() => {
    const a = document.activeElement;
    if (!a || !(a.tagName==='TEXTAREA' || a.tagName==='INPUT')){
      document.querySelectorAll('.ci.focus').forEach(r=>r.classList.remove('focus'));
      showKbar(false);
      if (cur && cur.type==='check'){ bloomCheck(true); cleanupEmpty(); }
    }
  }, 120);
});
function cleanupEmpty(){
  const keep = cur.items.filter(i => i.t.trim());
  if (keep.length !== cur.items.length){ cur.items = keep; save(); renderChecklist(); }
}

/* ---------- swipe: right = strike, left = delete ---------- */
let sw = null;
$('#nbody').addEventListener('pointerdown', e => {
  if (e.target.closest('.grip') || e.target.closest('.x')) return;
  const row = e.target.closest('.ci'); if (!row || !cur || cur.type!=='check') return;
  sw = { row, x:e.clientX, y:e.clientY, dx:0, on:false, id:e.pointerId };
});
$('#nbody').addEventListener('pointermove', e => {
  if (!sw || drag) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.on){
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ sw = null; return; }
    if (Math.abs(dx) < 14 || Math.abs(dx) < Math.abs(dy)*1.4) return;
    sw.on = true;
    try { sw.row.setPointerCapture(sw.id); } catch(_){}
    document.activeElement?.blur();
  }
  e.preventDefault();
  sw.dx = dx;
  sw.row.classList.toggle('sw-r', dx > 0); sw.row.classList.toggle('sw-l', dx < 0);
  sw.row.querySelector('.cin').style.transform = `translateX(${dx}px)`;
});
function endSwipe(){
  if (!sw) return;
  const s = sw; sw = null;
  if (!s.on) return;
  const cin = s.row.querySelector('.cin'), w = s.row.offsetWidth;
  if (s.dx > Math.min(90, w*.25)){
    cin.style.transition = 'transform .15s'; cin.style.transform = '';
    setTimeout(() => toggleStrike(s.row.dataset.id), 150);
  } else if (s.dx < -Math.min(110, w*.3)){
    cin.style.transition = 'transform .18s'; cin.style.transform = `translateX(${-w}px)`;
    setTimeout(() => removeItem(s.row.dataset.id), 180);
  } else {
    cin.style.transition = 'transform .18s'; cin.style.transform = '';
    setTimeout(() => { cin.style.transition=''; s.row.classList.remove('sw-l','sw-r'); }, 200);
  }
  // swallow the click that follows a swipe so it doesn't focus the text
  const stop = ev => { ev.stopPropagation(); ev.preventDefault(); };
  s.row.addEventListener('click', stop, {capture:true, once:true});
  setTimeout(() => s.row.removeEventListener('click', stop, {capture:true}), 400);
}
$('#nbody').addEventListener('pointerup', endSwipe);
$('#nbody').addEventListener('pointercancel', () => { if (sw && sw.on) { sw.dx = 0; } endSwipe(); });

/* ---------- drag to reorder ---------- */
let drag = null;
$('#nbody').addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip'); if (!g) return;
  e.preventDefault();
  const row = g.closest('.ci');
  const rows = [...$('#nbody').querySelectorAll('.ci')];
  drag = { row, rows, startY: e.clientY, idx: rows.indexOf(row), to: rows.indexOf(row),
    h: row.offsetHeight, mids: rows.map(r => { const b = r.getBoundingClientRect(); return b.top + b.height/2; }) };
  row.classList.add('dragging'); g.setPointerCapture(e.pointerId);
});
$('#nbody').addEventListener('pointermove', e => {
  if (!drag) return;
  const dy = e.clientY - drag.startY, y = drag.mids[drag.idx] + dy;
  drag.to = drag.mids.filter((m,k) => k !== drag.idx && m < y).length;
  drag.row.style.transform = `translateY(${dy}px)`;
  drag.rows.forEach((r,k) => {
    if (r === drag.row) return;
    let s = 0;
    if (drag.idx < drag.to && k > drag.idx && k <= drag.to) s = -drag.h;
    if (drag.idx > drag.to && k < drag.idx && k >= drag.to) s = drag.h;
    r.style.transition = 'transform .15s'; r.style.transform = s ? `translateY(${s}px)` : '';
  });
});
function endDrag(){
  if (!drag) return;
  const { idx, to } = drag; drag = null;
  if (idx !== to){ const [m] = cur.items.splice(idx,1); cur.items.splice(to,0,m); changed(true); }
  renderChecklist();
}
$('#nbody').addEventListener('pointerup', endDrag);
$('#nbody').addEventListener('pointercancel', endDrag);

/* ---------- title ---------- */
$('#nTitle').addEventListener('input', e => { cur.title = e.target.value; changed(); });
$('#nTitle').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode===229) return;
  e.preventDefault();
  if (cur.type==='text'){ const t=$('#eText'); t.focus(); t.setSelectionRange(0,0); }
  else focusNew();
});

/* ---------- keyboard bar (follows the iOS keyboard) ---------- */
function showKbar(on){
  $('#kbar').classList.toggle('hidden', !on);
  if (on) placeKbar();
}
function placeKbar(){
  const vv = window.visualViewport; if (!vv) return;
  const off = window.innerHeight - vv.height - vv.offsetTop;
  $('#kbar').style.transform = off > 0 ? `translateY(${-off}px)` : '';
  $('#kbar').style.paddingBottom = off > 40 ? '6px' : '';
}
window.visualViewport?.addEventListener('resize', placeKbar);
window.visualViewport?.addEventListener('scroll', placeKbar);
$('#kDone').addEventListener('pointerdown', e => e.preventDefault());
$('#kDone').onclick = () => document.activeElement?.blur();

/* ---------- undo / redo ---------- */
const snap = () => JSON.stringify({title:cur.title, body:cur.body, items:cur.items, type:cur.type});
function snapshot(force){
  const s = snap();
  if (!force && hist[hpos] === s) return;
  hist = hist.slice(0, hpos+1); hist.push(s); if (hist.length>200) hist.shift(); hpos = hist.length-1; updUndo();
}
function changed(now){
  touch();
  clearTimeout(histTimer);
  if (now) snapshot(); else { histTimer = setTimeout(()=>snapshot(), 450); $('#undoBtn').disabled = false; }
}
function restore(s){
  const o = JSON.parse(s); Object.assign(cur, o); cur.updated = Date.now(); save();
  $('#nTitle').value = cur.title; paintBody(); paintMeta(); updUndo();
}
['undoBtn','redoBtn'].forEach(id => $('#'+id).addEventListener('pointerdown', e => e.preventDefault()));
$('#undoBtn').onclick = () => { clearTimeout(histTimer); snapshot(); if (hpos>0){ hpos--; restore(hist[hpos]); } };
$('#redoBtn').onclick = () => { if (hpos<hist.length-1){ hpos++; restore(hist[hpos]); } };
function updUndo(){ $('#undoBtn').disabled = hpos<=0; $('#redoBtn').disabled = hpos>=hist.length-1; }
function touch(){ cur.updated = Date.now(); save(); paintMeta(); }

/* ---------- note header actions ---------- */
function closeNote(){
  if (!cur) return;
  document.activeElement?.blur();
  clearTimeout(histTimer);
  bloomCheck(false);
  if (cur.type==='check') cur.items = cur.items.filter(i=>i.t.trim());
  if (isEmpty(cur)) state.notes = state.notes.filter(n=>n!==cur);
  save(); cur = null;
  $('#noteView').classList.add('hidden'); $('#kbar').classList.add('hidden');
  $('#nbody').innerHTML = '';
  document.querySelector('meta[name=theme-color]').content = '#F7F1E8';
  renderList();
}
$('#hBack').onclick = closeNote;
$('#hColor').onclick = pickColor;
function pickColor(){
  document.activeElement?.blur();
  const host = overlay(`<div class="backdrop bottom"><div class="sheet"><h4>選擇顏色</h4>
    <div class="palette">${CKEYS.map(k=>`<button data-c="${k}" class="${cur.color===k?'on':''}" style="background:${col(k).hd}" aria-label="${col(k).name}"></button>`).join('')}</div></div></div>`);
  host.onclick = e => {
    if (e.target.classList.contains('backdrop')) return closeOverlay();
    const c = e.target.dataset.c; if (!c) return;
    cur.color = c; touch(); setTheme(); closeOverlay();
  };
}
$('#hMore').onclick = () => {
  document.activeElement?.blur();
  const rows = [];
  rows.push({label: cur.pinned ? '取消釘選' : '釘選到最上方', fn:()=>{ cur.pinned=!cur.pinned; touch(); toast(cur.pinned?'已釘選':'已取消釘選'); }});
  rows.push({label: cur.type==='text' ? '轉為清單（每行一條）' : '轉為文字', fn:convert});
  if (cur.type==='check' && cur.items.length > 1) rows.push({label:'上下順序反轉', fn:()=>{ cur.items.reverse(); changed(true); renderChecklist(); }});
  if (cur.type==='check' && cur.items.some(i=>i.done)){
    rows.push({label:'全部恢復（取消劃線）', fn:()=>{ cur.items.forEach(i=>i.done=false); changed(true); renderChecklist(); }});
    rows.push({label:'清掉劃掉的行', fn:()=>{ cur.items = cur.items.filter(i=>!i.done); changed(true); renderChecklist(); }});
  }
  rows.push({label:'分享', fn:()=>{
    const txt = (cur.title ? cur.title+'\n\n' : '') + plain(cur);
    if (navigator.share) navigator.share({text:txt}).catch(()=>{});
    else navigator.clipboard?.writeText(txt).then(()=>toast('已複製'));
  }});
  rows.push({label:'複製全文', fn:()=>{
    navigator.clipboard?.writeText((cur.title ? cur.title+'\n\n' : '') + plain(cur)).then(()=>toast('已複製'), ()=>toast('複製失敗'));
  }});
  rows.push({label:'刪除', danger:true, fn:()=>{
    const n = cur; n.deleted = true; n.pinned = false;
    if (n.type==='check') n.items = n.items.filter(i=>i.t.trim());
    const empty = isEmpty(n);
    if (empty) state.notes = state.notes.filter(x=>x!==n);
    cur = null; save();
    $('#noteView').classList.add('hidden'); $('#kbar').classList.add('hidden'); $('#nbody').innerHTML='';
    document.querySelector('meta[name=theme-color]').content = '#F7F1E8';
    renderList();
    if (!empty) toast('已移到垃圾桶', {label:'復原', fn:()=>{ n.deleted=false; save(); renderList(); }});
  }});
  sheet(rows);
};
function convert(){
  if (cur.type==='text'){
    cur.items = cur.body.split('\n').map(s=>s.trim()).filter(Boolean).map(t=>({id:uid(),t,done:false,b:!!cur.b}));
    cur.type = 'check';
  } else {
    cur.body = cur.items.filter(i=>i.t.trim()).map(i=>i.t).join('\n');
    cur.type = 'text';
  }
  changed(true); paintBody(); paintMeta();
  toast(cur.type==='check' ? '已轉為清單' : '已轉為文字');
}

/* ================= garden ================= */
// soil-ridge slots on img/field.webp (941x800), back ridge first so front ones overlap correctly
const RIDGES = [[600,170,800,440],[460,230,660,480],[320,280,530,530],[190,340,390,590]];
const SLOTS = RIDGES.flatMap(([x1,y1,x2,y2]) => [0.1,0.26,0.42,0.58,0.74,0.9].map(t => [x1+(x2-x1)*t, y1+(y2-y1)*t]));
function weekKeys(){
  const d = new Date(); const back = (d.getDay()+6)%7;        // Monday-start week
  return [...Array(back+1)].map((_,i) => { const x = new Date(d); x.setDate(d.getDate()-back+i); return dayKey(x); });
}
function openGarden(){
  const days = state.garden.days, today = dayKey();
  let f = 0, eggs = [];
  weekKeys().forEach(k => { const d = days[k]; if (!d) return; f += d.f;
    for (let i=0;i<d.e;i++) eggs.push(i < d.g ? 'egg-gold' : k===today ? 'egg-small' : 'egg'); });
  const shown = eggs.slice(0, SLOTS.length);
  const imgs = shown.map((n,i) => [n, SLOTS[i]]).sort((a,b) => a[1][1]-b[1][1])
    .map(([n,[x,y]]) => `<img src="${IMG(n)}" style="left:${x/941*100}%;top:${y/800*100}%" alt="">`).join('');
  const more = eggs.length - shown.length;
  const t = state.garden.tot;
  const host = overlay(`<div class="garden">
    <div class="ghead"><h2>茄子田</h2><button class="ib" id="gClose" aria-label="關閉">${I.close}</button></div>
    <div class="field">${imgs}<div class="sign">本週<br>${eggs.length} 顆</div></div>
    <div class="gstats">
      <div class="gstat"><img src="${IMG('flower')}" alt=""><div><b>${f}</b><span>本週開的花</span></div></div>
      <div class="gstat"><img src="${IMG('egg')}" alt=""><div><b>${eggs.length}</b><span>本週結的茄子</span></div></div>
    </div>
    <p class="gnote">${eggs.length
      ? (more>0 ? `田裡種不下了，還有 ${more} 顆收在籃子裡。<br>` : '') + '每一顆茄子，都是一個你想完、放下的念頭。'
      : '這週的田還空著。<br>記下一個想法會開一朵花，<br>在清單裡往右滑劃掉它，就會結出一顆茄子。'}</p>
    <p class="gtotal">到目前為止：${t.f} 朵花　·　${t.e} 顆茄子</p>
  </div>`);
  $('#gClose').onclick = closeOverlay;
}

/* ================= overlays ================= */
function overlay(html){ const o = $('#overlay'); o.innerHTML = html; return o.firstChild; }
function closeOverlay(){ $('#overlay').innerHTML = ''; }
function sheet(rows, title){
  const el = overlay(`<div class="backdrop bottom"><div class="sheet">${title?`<h4>${esc(title)}</h4>`:''}
    ${rows.map((r,i)=>`<button class="opt ${r.danger?'danger':''}" data-i="${i}">
      ${r.dot?`<span class="dot" style="background:${r.dot}"></span>`:''}<span>${esc(r.label)}</span>${r.on?'<span class="on">✓</span>':''}</button>`).join('')}
  </div></div>`);
  el.onclick = e => {
    if (e.target === el) return closeOverlay();
    const b = e.target.closest('.opt'); if (!b) return;
    closeOverlay(); rows[+b.dataset.i].fn();
  };
}
function confirmDlg(msg, onOk){
  overlay(`<div class="backdrop"><div class="dlg"><h3>${esc(msg)}</h3>
    <div class="acts"><button id="dlgNo">取消</button><button id="dlgOk" style="color:#d0443a">刪除</button></div></div></div>`);
  $('#dlgNo').onclick = closeOverlay;
  $('#dlgOk').onclick = () => { closeOverlay(); onOk(); };
}
let toastT;
function toast(msg, action){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>` + (action?`<button>${esc(action.label)}</button>`:'');
  if (action) t.querySelector('button').onclick = () => { action.fn(); t.remove(); };
  document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), 3500);
}

/* ================= backup ================= */
function exportData(){
  const data = JSON.stringify({app:'colornotes', version:1, exported:Date.now(), notes:state.notes, garden:state.garden}, null, 1);
  const d = new Date(), name = `茄記備份-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}.json`;
  const file = new File([data], name, {type:'application/json'});
  if (navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file]}).catch(()=>{});
  else { const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
}
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value=''; if (!f) return;
  try {
    const data = JSON.parse(await f.text()); if (!Array.isArray(data.notes)) throw 0;
    const have = new Map(state.notes.map(n=>[n.id,n])); let a=0,u=0;
    for (const n0 of data.notes){
      const n = fixNote(n0), h = have.get(n.id);
      if (!h){ state.notes.push(n); a++; } else if (n.updated > h.updated){ Object.assign(h,n); u++; }
    }
    if (data.garden && data.garden.days){                       // keep the bigger count per day
      const g = state.garden;
      for (const [k,d] of Object.entries(data.garden.days)){
        const m = g.days[k] || (g.days[k] = {f:0,e:0,g:0});
        m.f = Math.max(m.f, d.f||0); m.e = Math.max(m.e, d.e||0); m.g = Math.max(m.g, d.g||0);
      }
      g.tot.f = Math.max(g.tot.f, data.garden.tot?.f||0); g.tot.e = Math.max(g.tot.e, data.garden.tot?.e||0);
    }
    save(); renderList(); toast(`匯入完成：新增 ${a}、更新 ${u}`);
  } catch { toast('這個檔案不是茄記備份'); }
};

document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else if (cur) paintMeta(); else renderList(); });
window.addEventListener('pagehide', save);
window.addEventListener('resize', sizeText);

renderList();
})();
